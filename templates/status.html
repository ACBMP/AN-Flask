{% extends "layout.html" %}
{% block content %}
<meta content="Assassins' Network | Status" property="og:title" />
<meta content="Assassin's Creed multiplayer server status page." property="og:description" />
<meta content="https://assassins.network/status" property="og:url" />
<div class="page-header">
  <div>
    <h1>ACB Status</h1>
    <p class="page-subtitle">Live server &amp; service health.</p>
  </div>
</div>
    <div class="card table-wrap">
    <table>
        <tr>
            <th>Server</th>
            <th>Status</th>
        </tr>
    {% for entry in data %}
    <tr>
        <td>{{ entry.name }}</td>
        {%if entry.status %}
            <td><span class="pill pill-win">Online</span></td>
        {%else%}
            <td><span class="pill pill-loss">Offline</span></td>
        {%endif%}
    </tr>
    {% endfor %}
    </table>
    </div>
    {% endblock content %}
