{% extends "layout.html" %}
{% block content %}
<meta content="Assassins' Network | Train" property="og:title" />
<meta content="Assassin's Creed: Brotherhood Training" property="og:description" />
<meta content="https://assassins.network/train" property="og:url" />
<style>
html, body {
    margin: 0;
    padding: 0;
    height: 100%;
}

canvas#gameCanvas {
    display: block;
    position: absolute;
    z-index: 0;
}

#mapSelect, #nextBtn, #stats, #minimap {
    position: absolute;   /* place them wherever you want */
    z-index: 10;          /* above the canvas */
}
#mapSelect { top: 60px; left: 20px }
#nextBtn { top: 60px;  right: 250px } 
#minimap { top: 80px; right: 10px; }
#stats { bottom: 10px; left: 10px; }
#gameCanvas { top: 50px; left: 300px; right: 300px;}
</style>
<body>
  <select id="mapSelect"></select>
  <button id="nextBtn">Next</button>
  <div id="loadingOverlay" style="
    position: absolute;
    top: 0; left: 0;
    width: 100%; height: 100%;
    color: white;
    font-size: 24px;
    display: flex;
    align-items: center;
    justify-content: center;
    z-index: 100;
">
    Loading map...
</div>
<canvas id="gameCanvas"></canvas>
  <canvas id="minimap" width="300" height="300"></canvas>
  <div id="stats"></div>

  <script type="importmap">
{
  "imports": {
    "three": "https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js",
    "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.160.0/examples/jsm/"
  }
}
</script>

<script type="module" src="/static/js/train.js"></script>
</body>
{% endblock content %}
